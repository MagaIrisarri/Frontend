function validateUser(v,{editing=false,id=null}={}){
  const er={};

  if(v.name.trim().length<2)er.nom='Ingresá un nombre de al menos 2 caracteres.';
  if(v.last_name.trim().length<2)er.ape='Ingresá un apellido de al menos 2 caracteres.';
  if(!v.dob)er.nac='Ingresá la fecha de nacimiento.';else if(age(v.dob)<18)er.nac='Tiene que ser mayor de 18 años.';
  if(!/^\d{6,15}$/.test(v.phone.replace(/\s/g,'')))er.tel='Solo dígitos, entre 6 y 15.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email.trim()))er.mail='Ingresá un email válido.';
  else if(users.some(u=>u.id!==id&&u.email.toLowerCase()===v.email.trim().toLowerCase()))er.mail='El email ya está registrado.';
  if(!editing&&v.password.trim().length<6)er.pw='Mínimo 6 caracteres.';

  <div class="split"><section class="panel side" aria-label="Cocheras"><div id="bl"></div></section><section class="panel main" aria-label="Detalle de la cochera" id="det"></section></div>`;
  $('#q').value=P.q;$('#loc').value=P.loc;
  $('#q').oninput=e=>{P.q=e.target.value;paintParkings()};$('#loc').onchange=e=>{P.loc=e.target.value;paintParkings()};
  paintParkings();paintParking()}
function paintParkings(){
  const on=p=>P.st==='all'||p.active===(P.st==='on');
  $('#seg').innerHTML=[['all','Todas'],['on','Activas'],['off','Pausadas']].map(([k,l])=>`<button type="button" aria-pressed="${P.st===k}" data-k="${k}">${l}<b>${parkings.filter(p=>k==='all'||p.active===(k==='on')).length}</b></button>`).join('');
  $$('#seg button').forEach(b=>b.onclick=()=>{P.st=b.dataset.k;paintParkings()});
  const t=norm(P.q.trim()),rows=parkings.filter(p=>on(p)&&(!P.loc||p.loc===P.loc)&&(!t||norm(`${p.name} ${p.address} ${uname(byId(p.ownerId))}`).includes(t))).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  $('#bl').innerHTML=rows.length?rows.map(p=>{const s=pState(p);return `<button type="button" class="bi" aria-current="${P.sel===p.id}" data-p="${p.id}"><span><span class="nm">${esc(p.name)}</span><span class="ad">${esc(p.loc)}</span></span>${s.c!=='ok'?`<span class="st ${s.c}">${s.l}</span>`:''}</button>`}).join(''):'<p class="ad" style="padding:8px 12px">Ninguna cochera coincide con los filtros.</p>';
  $$('#bl .bi').forEach(b=>b.onclick=()=>{P.sel=b.dataset.p;paintParkings();paintParking()})}
function paintParking(){
  const p=parkings.find(x=>x.id===P.sel);
  if(!p){$('#det').innerHTML=empty('car','Elegí una cochera','Mirá su ocupación, tarifas, personal y movimiento.');return}
  const o=byId(p.ownerId),s=pState(p),sin=p.rows.filter(r=>r[4]==null).map(r=>r[0].toLowerCase()),team=users.filter(u=>u.parkingId===p.id&&u.status==='ACTIVO').map(uname),tot=p.rows.reduce((a,r)=>a+r[1],0),oc=p.rows.reduce((a,r)=>a+r[2],0);
  $('#det').innerHTML=`<div class="phead" style="align-items:flex-start"><div><h2 style="font-size:18px;font-weight:600">${esc(p.name)}</h2><div class="ad">${esc(p.address)}</div></div><span class="st ${s.c}">${s.l}</span></div>
  ${!p.active?'<p class="ad">Pausada por su dueño: los clientes no la ven ni reservan en ella.</p>':''}
  ${sin.length?`<p class="st warn">Sin tarifa para ${sin.join(', ')}: esos clientes no pueden reservar.</p>`:''}
  <div class="fs"><div class="fh"><h3>Dueño</h3></div><dl class="dl"><dt>Nombre</dt><dd>${esc(uname(o))}</dd><dt>Email</dt><dd>${esc(o.email)}</dd><dt>Teléfono</dt><dd>${o.phone}</dd></dl></div>
  <div class="fs"><div class="fh"><h3>Atención</h3></div><dl class="dl"><dt>Horario</dt><dd>${p.hours}</dd><dt>Reserva</dt><dd>${p.res}</dd><dt>Personal</dt><dd>${team.length?esc(team.join(', ')):'Sin empleados asignados'}</dd></dl></div>
  <div class="fs"><div class="fh"><h3>Plazas y tarifas</h3></div><div class="panel tw"><table class="tbl"><thead><tr><th>Tipo</th><th class="r">En servicio</th><th class="r">Ocupadas</th><th class="r">Mantenimiento</th><th class="r">Tarifa por hora</th></tr></thead><tbody>${p.rows.map(r=>`<tr><td class="nm">${r[0]}</td><td class="r">${r[1]}</td><td class="r">${r[2]}</td><td class="r">${r[3]}</td><td class="r">${r[4]==null?'<span class="st warn">Sin tarifa</span>':money(r[4])}</td></tr>`).join('')}</tbody></table></div><p class="ad">Ocupación ahora: ${tot?Math.round(oc/tot*100):0} % de las plazas en servicio.</p></div>
  <div class="fs"><div class="fh"><h3>Movimiento</h3></div><dl class="dl"><dt>Reservas finalizadas</dt><dd><b>${p.m.fin}</b></dd><dt>En curso</dt><dd>${p.m.curso}</dd><dt>Pendientes y confirmadas</dt><dd>${p.m.pend}</dd><dt>Canceladas</dt><dd>${p.m.canc}</dd><dt>Facturado</dt><dd>${money(p.m.fact)}</dd></dl></div>`}

/* Vehículos — solo lectura */
const V={q:'',t:'all'};
function viewVehiculos(){
  app.innerHTML=head('Vehículos',`${plural(vehicles.length,'vehículo registrado','vehículos registrados')} por los clientes.`)+
  `<div class="toolbar">${searchBox('q','Buscar por patente, marca, modelo o cliente')}</div><div class="seg" id="seg" role="group" aria-label="Filtrar por tipo de vehículo"></div><div id="tbl"></div>`;
  $('#q').value=V.q;$('#q').oninput=e=>{V.q=e.target.value;paintVeh()};paintVeh()}
function paintVeh(){
  $('#seg').innerHTML=[['all','Todos'],...TYPES.map(t=>[t,t])].map(([k,l])=>`<button type="button" aria-pressed="${V.t===k}" data-k="${k}">${l}<b>${vehicles.filter(v=>k==='all'||v.type===k).length}</b></button>`).join('');$$('#seg button').forEach(b=>b.onclick=()=>{V.t=b.dataset.k;paintVeh()});
  const t=norm(V.q.replace(/\s/g,'')),cn=v=>{const c=byId(v.client);return c?uname(c):''};
  const rows=vehicles.filter(v=>(V.t==='all'||v.type===V.t)&&(!t||norm(`${v.plate}${v.brand}${v.model}${cn(v)}`.replace(/\s/g,'')).includes(t))).sort((a,b)=>a.plate.localeCompare(b.plate));
  if(!rows.length){$('#tbl').innerHTML=`<div class="panel">${empty('search','Sin resultados','Ningún vehículo coincide con los filtros actuales.','<button type="button" class="btn" id="clr">Limpiar filtros</button>')}</div>`;$('#clr').onclick=()=>{V.q='';V.t='all';$('#q').value='';paintVeh()};return}
  $('#tbl').innerHTML=`<div class="panel tw"><table class="tbl"><thead><tr><th style="width:150px">Patente</th><th>Marca y modelo</th><th style="width:120px">Tipo</th><th style="width:170px">Seguro</th><th>Cliente</th></tr></thead><tbody>${rows.map(v=>`<tr>
    <td><span class="plate">${v.plate}</span><div class="ad">${v.year} · ${v.color}</div></td><td><span class="nm">${v.brand}</span><div class="ad">${v.model}</div></td><td>${v.type}</td>
    <td>${v.ins||'<span class="na">Sin seguro</span>'}</td><td><button type="button" class="link" data-c="${v.client}" aria-label="Ver datos de ${esc(cn(v))}">${esc(cn(v))}</button></td></tr>`).join('')}</tbody></table></div>`;
  $$('[data-c]').forEach(b=>b.onclick=()=>{const c=byId(b.dataset.c);drawer({title:uname(c),sub:'Cliente',foot:'<button type="button" class="btn" data-close>Cerrar</button>',
    body:`<div class="li"><span class="av">${esc(initials(c.name,c.last_name))}</span><div><div class="nm">${esc(uname(c))}</div><div class="ad">${esc(c.email)}</div></div></div><dl class="dl"><dt>DNI</dt><dd>${c.dni}</dd><dt>Email</dt><dd>${esc(c.email)}</dd><dt>Teléfono</dt><dd>${c.phone}</dd><dt>Vehículos</dt><dd>${vehicles.filter(v=>v.client===c.id).map(v=>v.plate).join(', ')}</dd></dl>`})})}

/* Marcas — lista a la izquierda, modelos de la marca elegida a la derecha, agrupados por tipo y con filtro por tipo */
const M={brand:'Ford',type:'Todos',q:'',tab:'cat',imp:null};
function viewMarcas(){
  app.innerHTML=head('Marcas y modelos','Marcas y modelos disponibles al registrar un vehículo.')+
  `<div class="seg" role="group" aria-label="Sección">${[['cat','Catálogo'],['csv','Actualizar con CSV']].map(([k,l])=>`<button type="button" data-tab="${k}" aria-pressed="${M.tab===k}">${l}</button>`).join('')}</div><div id="tabbody"></div>`;
  $$('[data-tab]').forEach(b=>b.onclick=()=>{M.tab=b.dataset.tab;viewMarcas()});
  if(M.tab==='csv')return importCsv();
  $('#tabbody').innerHTML=`<div class="split"><section class="panel side" aria-label="Marcas">${searchBox('q','Buscar marca')}<div id="bl"></div></section><section class="panel main" aria-label="Modelos de la marca" id="det"></section></div>`;
  $('#q').value=M.q;$('#q').oninput=e=>{M.q=e.target.value;paintBrands()};paintBrands();paintModels()}
/* Actualizar con CSV (DNRPA): el navegador lee el archivo, deduplica y pide una vista previa (dryRun) antes de agregar.
   Solo agrega marcas y modelos que faltan; no borra ni edita. RA-14 a RA-17. En el prototipo la lectura es simulada. */
const CSV_NEW={Ford:[['Mondeo','Auto']],Toyota:[['Yaris','Auto'],['Corolla Cross','Camioneta']],BYD:[['Dolphin','Auto'],['Song Plus','Camioneta']],Chery:[['Tiggo 4 Pro','Camioneta']]};
function importCsv(){
  const p=M.imp;
  const newBrands=p?Object.keys(CSV_NEW).filter(b=>!brands[b]).length:0,newModels=p?Object.values(CSV_NEW).reduce((a,l)=>a+l.length,0):0;
  $('#tabbody').innerHTML=`<section class="panel" style="padding:24px;display:grid;gap:16px">
    <div class="fs"><div class="fh"><h3>Archivo del DNRPA</h3></div>
    <p class="ad">Descargá el CSV mensual de inscripciones iniciales de datos.gob.ar y elegilo acá. Solo se agregan las marcas y modelos que todavía no están; no se borra ni se cambia nada de lo existente.</p>
    <div class="field"><label for="csv">Archivo CSV</label><input class="inp" id="csv" type="file" accept=".csv,text/csv"><span class="hint">Hasta 25 MB. Usa las columnas de marca, modelo y tipo de automotor.</span></div></div>
    ${p?`<div class="fs" aria-live="polite"><div class="fh"><h3>Vista previa</h3></div>
      <dl class="dl"><dt>Filas leídas</dt><dd>45.305</dd><dt>Combinaciones únicas</dt><dd>1.644</dd><dt>Marcas nuevas</dt><dd>${newBrands}</dd><dt>Modelos nuevos</dt><dd>${newModels}</dd><dt>Ya existían</dt><dd>1.601</dd><dt>Omitidos</dt><dd>40 (acoplados, tractores, chasis y ómnibus)</dd></dl>
      <div class="panel tw"><table class="tbl"><thead><tr><th>Marca</th><th>Modelo</th><th style="width:120px">Tipo</th></tr></thead><tbody>${Object.entries(CSV_NEW).flatMap(([b,l])=>l.map(m=>`<tr><td class="nm">${b}</td><td>${m[0]}</td><td>${m[1]}</td></tr>`)).join('')}</tbody></table></div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" id="cancel">Descartar</button><button type="button" class="btn pri" id="go">Agregar ${plural(newModels,'modelo','modelos')}</button></div></div>`:
      empty('car','Todavía no elegiste un archivo','Elegí el CSV para ver qué marcas y modelos se agregarían antes de confirmar.')}</section>`;
  $('#csv').onchange=e=>{if(!e.target.files[0])return;M.imp=true;importCsv();$('#csv').focus()};
  if(p){$('#cancel').onclick=()=>{M.imp=null;importCsv()};
    $('#go').onclick=()=>{for(const [b,l] of Object.entries(CSV_NEW))brands[b]=[...(brands[b]||[]),...l.filter(m=>!(brands[b]||[]).some(x=>x[0]===m[0]))];M.imp=null;M.tab='cat';toast(`Se agregaron ${plural(newModels,'modelo','modelos')} y ${plural(newBrands,'marca','marcas')}.`);viewMarcas()}}}
function paintBrands(){
  const t=norm(M.q.trim()),names=Object.keys(brands).filter(n=>!t||norm(n).includes(t));
  $('#bl').innerHTML=names.length?names.map(n=>`<button type="button" class="bi" aria-current="${n===M.brand}" data-b="${n}"><span>${n}</span></button>`).join(''):'<p class="ad" style="padding:8px 12px">Ninguna marca coincide.</p>';
  $$('#bl .bi').forEach(b=>b.onclick=()=>{M.brand=b.dataset.b;M.type='Todos';paintBrands();paintModels()})}
function paintModels(){
  const ms=brands[M.brand]||[],shown=TYPES.filter(t=>M.type==='Todos'||M.type===t);
  const groups=shown.map(t=>[t,ms.filter(m=>m[1]===t)]).filter(g=>g[1].length);
  $('#det').innerHTML=`<div class="phead"><div><h2 style="font-size:18px;font-weight:600">${M.brand}</h2><div class="ad">${plural(ms.length,'modelo','modelos')}</div></div>
  <div class="seg" role="group" aria-label="Filtrar por tipo de vehículo">${['Todos',...TYPES].map(t=>`<button type="button" aria-pressed="${M.type===t}" data-t="${t}">${t}<b>${t==='Todos'?ms.length:ms.filter(m=>m[1]===t).length}</b></button>`).join('')}</div></div>
  <div>${groups.length?groups.map(([t,l])=>`<div class="gh"><span>${t}</span><b>${l.length}</b></div>${l.map(m=>`<div class="mr">${m[0]}</div>`).join('')}`).join(''):`<p class="ad" style="padding:16px 4px">${M.brand} no tiene modelos de tipo ${M.type.toLowerCase()}.</p>`}</div>`;
  $$('#det [data-t]').forEach(b=>b.onclick=()=>{M.type=b.dataset.t;paintModels()})}

/* Catálogos simples: Seguros (listar y agregar) y Servicios (alta, edición y baja) */
function catalog({title,sub,noun,list,withDesc,canEdit,canDelete,icon}){
  const q=$('#q')?.value||'';
  const t=norm(q.trim()),rows=list().filter(i=>!t||norm(i.name+' '+(i.description||'')).includes(t)).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  const newBtn=`<button type="button" class="btn pri" id="nuevo">${ic('plus','sm')}${noun.nuevo}</button>`,menu_=canEdit||canDelete;
  app.innerHTML=head(title,`${sub} ${plural(list().length,noun.one,noun.many)}.`,newBtn)+`<div class="toolbar">${searchBox('q','Buscar por nombre')}</div>`+
  (!list().length?`<div class="panel">${empty(icon,`Todavía no hay ${noun.many}`,'Cargá el primero para que esté disponible en todas las sucursales.')}</div>`:
   !rows.length?`<div class="panel">${empty('search','Sin resultados',`Ningún ${noun.one} coincide con “${esc(q)}”.`)}</div>`:
   `<div class="panel tw"><table class="tbl"><thead><tr><th>Nombre</th>${menu_?'<th style="width:64px"><span class="sr">Acciones</span></th>':''}</tr></thead><tbody>${rows.map(i=>`<tr><td><span class="nm">${esc(i.name)}</span>${i.description?`<div class="ad">${esc(i.description)}</div>`:''}</td>${menu_?`<td class="r"><button type="button" class="icon-btn" data-menu="${i.id}" aria-haspopup="menu" aria-label="Más acciones de ${esc(i.name)}">${ic('more')}</button></td>`:''}</tr>`).join('')}</tbody></table></div>`);
  const again=()=>catalog({title,sub,noun,list,withDesc,canEdit,canDelete,icon});
  $('#nuevo').onclick=()=>itemForm(null);$('#q').value=q;$('#q').oninput=again;
  $$('[data-menu]').forEach(b=>b.onclick=()=>{const it=list().find(x=>String(x.id)===b.dataset.menu);menu(b,[
    ...(canEdit?[{label:'Editar',run:()=>itemForm(it)}]:[]),...(canEdit&&canDelete?['-']:[]),
    ...(canDelete?[{label:'Eliminar',danger:true,run:()=>confirmModal({title:`¿Eliminar “${it.name}”?`,body:'Deja de estar disponible para elegir. Lo que ya lo usa no cambia.',ok:'Eliminar',danger:true,onOk:()=>{services=services.filter(x=>x!==it);toast(`“${it.name}” eliminado.`,'info');again()}})}]:[])])});
  function itemForm(it){
    const el=drawer({title:it?`Editar ${noun.one}`:noun.nuevo,sub:it?.name,foot:`<button type="button" class="btn" data-close>Cancelar</button><button type="submit" form="iform" class="btn pri">${it?'Guardar cambios':'Crear'}</button>`,
      body:`<form id="iform" novalidate style="display:contents"><section class="fs">${fld('nm','Nombre',{value:it?.name,attr:'maxlength="50" autocomplete="off"',first:true})}${withDesc?fld('ds','Descripción',{value:it?.description,attr:'maxlength="200" autocomplete="off"'}):''}</section></form>`});
    $('#iform',el).onsubmit=e=>{e.preventDefault();const er={},n=$('#nm',el).value.trim(),d=withDesc?$('#ds',el).value.trim():'';
      if(n.length<2)er.nm='Ingresá un nombre de al menos 2 caracteres.';if(withDesc&&d.length<5)er.ds='Ingresá una descripción de al menos 5 caracteres.';
      if(!setErrors(el,er))return;
      if(it){it.name=n;if(withDesc)it.description=d}else list().push({id:++seq,name:n,...(withDesc?{description:d}:{})});
      closeLayer();toast(`“${n}” ${it?'actualizado':'creado'}.`);again()}}}
const viewSeguros=()=>catalog({title:'Seguros',sub:'Aseguradoras que los clientes pueden elegir al registrar un vehículo.',noun:{one:'aseguradora',many:'aseguradoras',nuevo:'Nueva aseguradora'},list:()=>insurances,canEdit:false,canDelete:false,icon:'users'});
const viewServicios=()=>catalog({title:'Servicios',sub:'Catálogo general: cada dueño elige cuáles ofrece en sus sucursales y les pone precio.',noun:{one:'servicio',many:'servicios',nuevo:'Nuevo servicio'},list:()=>services,withDesc:true,canEdit:true,canDelete:true,icon:'car'});

/* ───── Rutas y tema ───── */
const ROUTES={panel:viewPanel,usuarios:viewUsuarios,cocheras:viewCocheras,vehiculos:viewVehiculos,marcas:viewMarcas,seguros:viewSeguros,servicios:viewServicios};
function route(){const k=ROUTES[location.hash.slice(2)]?location.hash.slice(2):'panel';closeLayer();closeMenu();
  $('#nav').innerHTML=VIEWS.map(([id,l])=>`<a href="#/${id}"${id===k?' aria-current="page"':''}>${l}</a>`).join('');ROUTES[k]();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
$('#theme').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};
</script>
</body>
</html>
