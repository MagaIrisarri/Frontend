/* ───── Tokens ───── */
:root,[data-theme=dark]{
  --bg:#13161b;--surface:#1a1e25;--raised:#222730;--hover:#2a303b;--line:#323a47;--soft:#252b35;
  --tx:#e8ebf0;--tx2:#a4adbb;--tx3:#808997;
  --ac:#2f6bff;--ac-h:#4a80ff;--ac-soft:rgba(47,107,255,.16);--ac-tx:#85b0ff;
  --ok:#3ecf8e;--warn:#f0b43c;--err:#f26b78;
  --inp:#323a47;--warn-b:#f0b43c;--err-b:#f26b78;--scrim:rgba(8,10,14,.62);--shadow:0 16px 40px rgba(0,0,0,.5);
  --r-sm:6px;--r-md:8px;--r-lg:12px;--ctl:34px;
}
[data-theme=light]{
  --bg:#f2f4f7;--surface:#fff;--raised:#f6f7fa;--hover:#ecEFF4;--line:#d4dae3;--soft:#e5e9f0;--inp:#8590a2;
  --tx:#11151c;--tx2:#434d5e;--tx3:#5b6678;
  --ac:#2563eb;--ac-h:#1d4fd0;--ac-soft:rgba(37,99,235,.1);--ac-tx:#1d4ed8;
  --ok:#0e7a4b;--warn:#8a5700;--err:#bf2a38;--warn-b:#b87300;--err-b:#d43a48;
  --scrim:rgba(17,21,28,.42);--shadow:0 16px 40px rgba(17,21,28,.18);
}
[data-theme=light] .panel{box-shadow:0 0 0 1px var(--soft)}
*{box-sizing:border-box}
html{color-scheme:dark;scrollbar-gutter:stable}
html[data-theme=light]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac-h);outline-offset:2px}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:14px;height:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ───── Controles ───── */
.btn{height:var(--ctl);padding:0 12px;border:0;border-radius:var(--r-md);background:var(--raised);color:var(--tx);display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(.5px)}
.btn.pri{background:var(--ac);color:#fff}.btn.pri:hover{background:var(--ac-h)}
.btn.ghost{background:transparent;color:var(--tx2)}.btn.ghost:hover{background:var(--raised);color:var(--tx)}
.btn.danger{background:var(--err);color:#fff}.btn.danger:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled,.icon-btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn[aria-busy=true]{pointer-events:none;opacity:.8}
.icon-btn{width:32px;height:32px;border:0;border-radius:var(--r-md);background:transparent;color:var(--tx2);display:inline-grid;place-items:center;transition:background .12s}
.icon-btn:hover{background:var(--raised);color:var(--tx)}
.icon-btn.pri{background:var(--ac);color:#fff}.icon-btn.pri:hover{background:var(--ac-h)}
.icon-btn.sm{width:26px;height:26px}

  if(el.id)return '#'+el.id;
  const d=el.dataset||{};if(!d.act)return '';
  return `[data-act="${d.act}"]`+['id','key','v','f'].filter(k=>d[k]).map(k=>`[data-${k}="${d[k]}"]`).join('');
}
function openLayer(el,focusSel){
  const o=fromMenu||document.activeElement;opener[el.id]={el:o,sel:selOf(o)};
  el.classList.add('on');document.body.style.overflow='hidden';
  setTimeout(()=>{const f=$(focusSel||'[data-first],input:not([type=hidden]),select,textarea,.dfoot .btn',el);(f||$('.icon-btn',el)).focus()},30)
}
function closeLayer(el){
  if(!el.classList.contains('on'))return;
  el.classList.remove('on');el.innerHTML='';
  if(!$('#layer.on')&&!$('#modal.on'))document.body.style.overflow='';
  const o=opener[el.id];if(o){const t=document.contains(o.el)?o.el:(o.sel&&$(o.sel));t&&t.focus&&t.focus()}
}
function drawer(title,sub,body,foot,focusSel,cls=''){

  openLayer($('#layer'),focusSel);
}
function confirmDlg({title,body,ok,danger,run,back='Cancelar'}){
  confirmDlg.run=run;

  openLayer($('#modal'),'[data-first]');
}
function showMenu(btn,html){
  const m=$('#menu'); m.innerHTML=html; m.classList.add('on'); m.__btn=btn;
  const r=btn.getBoundingClientRect(), w=m.offsetWidth, h=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(innerWidth-w-8,r.right-w))+'px';
  m.style.top=(r.bottom+h+12>innerHeight?r.top-h-4:r.bottom+4)+'px';
  btn.setAttribute('aria-expanded','true'); $('button',m).focus();
}
function closeMenu(){const m=$('#menu');if(!m.classList.contains('on'))return;m.classList.remove('on');const b=m.__btn;if(b){b.removeAttribute('aria-expanded');b.focus()}}
const mi=(act,id,ico,txt,cls='')=>`<button role="menuitem" class="${cls}" data-act="${act}" data-id="${id}">${I(ico)}${txt}</button>`;
function toast(msg,type='ok',undo){
  const t=document.createElement('div');t.className='toast '+type;
  t.innerHTML=I(type==='ok'?'check':type==='err'?'alert':'pin')+`<span>${esc(msg)}</span>`;
  if(undo){const b=document.createElement('button');b.type='button';b.className='tb';b.textContent='Deshacer';b.onclick=()=>{t.remove();undo()};t.append(b)}

/* ═════ Semana tipo + excepciones por fecha + feriados ═════
   p.shifts/p.closed = semana tipo. p.ovr[fecha] = día completo que reemplaza a la plantilla. S.holidays = lista general del dueño;
   cada sucursal cierra por defecto y solo guarda en p.hx[idFeriado] lo que cambia ('o' abre como siempre, 's' horario especial). */
const FER=[['2026-10-12','Día del Respeto a la Diversidad Cultural'],['2026-11-23','Día de la Soberanía Nacional (trasladado)'],['2026-12-08','Inmaculada Concepción de María'],['2026-12-25','Navidad']]; // shortcut: lista de ejemplo, verificar con el calendario oficial; en la app real viene del backend
const hol=()=>S.holidays||(S.holidays=FER.map(([date,name])=>({id:nextId('h'),date,name})));
const wdOf=d=>(new Date(d+'T12:00').getDay()+6)%7;
const monday=d=>addD(d,-wdOf(d));
const holOn=date=>hol().find(h=>h.date===date);
const hmode=(p,h)=>(p.hx&&p.hx[h.id])||'c';
const wkLabel=wk=>{const a=new Date(wk+'T12:00'),b=new Date(addD(wk,6)+'T12:00'),f=(d,o)=>d.toLocaleDateString('es-AR',o);return (a.getMonth()===b.getMonth()?`${a.getDate()}–${f(b,{day:'numeric',month:'long'})}`:`${f(a,{day:'numeric',month:'short'})} – ${f(b,{day:'numeric',month:'short'})}`)+` de ${b.getFullYear()}`};
const tdayItems=(p,date)=>{const wd=wdOf(date);return {shifts:p.shifts.filter(x=>x.days.includes(wd)).map(x=>({id:x.id,eid:x.eid,from:x.from,to:x.to})),closed:p.closed.filter(x=>x.days.includes(wd)).map(x=>({id:x.id,from:x.from,to:x.to}))}};
const baseDay=(p,date)=>{const h=holOn(date);return h&&hmode(p,h)==='c'?{tag:'hol',h,shifts:[],closed:[{from:p.open,to:p.close,hol:true}]}:{tag:h?'open':'tpl',h,...tdayItems(p,date)}};
const effDay=(p,date)=>{const o=p.ovr&&p.ovr[date];if(!o)return baseDay(p,date);return {tag:holOn(date)?'esp':'mod',h:holOn(date),shifts:o.shifts,closed:o.closed}};
/* semana de trabajo: una copia editable de 7 fechas; cada columna es una fecha, y al terminar cada cambio se guarda como excepción solo si difiere de la plantilla */
function buildW(p,wk){const W=Object.create(p);W.wk=wk;W.shifts=[];W.closed=[];W.tags=[];
  for(let c=0;c<7;c++){const date=addD(wk,c),e=effDay(p,date);W.tags.push({tag:e.tag,h:e.h,date,past:date<TODAY,today:date===TODAY});
    e.shifts.forEach(x=>W.shifts.push({id:`t${date}${x.eid}${x.from}`,eid:x.eid,days:[c],from:x.from,to:x.to}));
    e.closed.forEach(x=>W.closed.push({id:`c${date}${x.from}`,days:[c],from:x.from,to:x.to,hol:!!x.hol}))}
  return W}
const sig=(sh,cl)=>JSON.stringify([sh.map(x=>[x.eid,x.from,x.to]).sort(),cl.map(x=>[x.from,x.to]).sort()]);
function commitW(W){const p=Object.getPrototypeOf(W);p.ovr=p.ovr||{};
  for(let c=0;c<7;c++){const date=addD(W.wk,c);if(date<TODAY)continue;
    const sh=W.shifts.filter(x=>x.days.includes(c)).map(x=>({id:x.id,eid:x.eid,from:x.from,to:x.to})),cl=W.closed.filter(x=>x.days.includes(c)&&!x.hol).map(x=>({id:x.id,from:x.from,to:x.to})),b=baseDay(p,date);
    if(sig(sh,cl)===sig(b.shifts,b.closed.filter(x=>!x.hol)))delete p.ovr[date];else p.ovr[date]={shifts:sh,closed:cl}}}
const cur=()=>{const p=pk(S.shP);if(S.shMode!=='date')return p;return S.W&&S.W.wk===S.shWk&&Object.getPrototypeOf(S.W)===p?S.W:(S.W=buildW(p,S.shWk))};
const resHits=(r,p,d)=>p.wk?r.date===addD(p.wk,d):r.date>=TODAY&&wdOf(r.date)===d;
const resUncovered=(p,date,shifts)=>S.reservas.filter(r=>r.pid===p.id&&(r.st==='curso'||r.st==='reservada')&&r.date===date&&!shifts.some(x=>x.eid===r.eid&&mm(x.from)<=mm(r.start)&&mmE(x.to)>=mmE(r.end)));
function excCheck(p,d){const rs=S.reservas.filter(r=>r.pid===p.id&&(r.st==='curso'||r.st==='reservada')&&r.date<=d&&(r.endDate||r.date)>=d);
  return rs.length?`No se puede cerrar el ${fmtD(d)}: hay ${rs.length} ${rs.length===1?'reserva activa o pendiente':'reservas activas o pendientes'} (${rs.slice(0,3).map(r=>r.code).join(', ')}${rs.length>3?'…':''}).`:''}
/* cambia lo que hace una sucursal en un feriado: 'c' cerrada, 'o' abre como siempre, 's' horario especial */
function setHolMode(p,h,m){
  const hx0=p.hx&&h.id in p.hx?p.hx[h.id]:undefined,o0=p.ovr&&p.ovr[h.date];
  if(m==='c'){const er=excCheck(p,h.date);if(er)return {err:er}}
  else if(m==='o'&&o0){const u=resUncovered(p,h.date,tdayItems(p,h.date).shifts);if(u.length)return {err:`No se puede volver a los turnos de siempre: ${u.slice(0,3).map(r=>r.code).join(', ')} quedarían sin empleado asignado en ese horario. Reasignalas desde Reservas.`}}
  p.hx=p.hx||{};if(m==='c')delete p.hx[h.id];else p.hx[h.id]=m;
  p.ovr=p.ovr||{};if(m!=='s')delete p.ovr[h.date];
  else if(!p.ovr[h.date]){const t=tdayItems(p,h.date);p.ovr[h.date]={shifts:t.shifts.map(x=>({...x,id:nextId('t')})),closed:t.closed.map(x=>({...x,id:nextId('c')}))}}
  return {undo:()=>{if(hx0===undefined)delete p.hx[h.id];else p.hx[h.id]=hx0;if(o0)p.ovr[h.date]=o0;else delete p.ovr[h.date]}};
}

const csv=(name,rows)=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)};

const MAX_DAY=8,MAX_HARD=12; // shortcut: topes de referencia fijos (no bloquean); parametrizar por convenio cuando haya backend
const fmtH=h=>String(Math.round(h*10)/10).replace('.',',')+' h';
function empLoad(p,e){const dh=Array(7).fill(0);p.shifts.filter(x=>x.eid===e.id).forEach(x=>x.days.forEach(d=>dh[d]+=(mmE(x.to)-mm(x.from))/60));return {dh,wk:dh.reduce((a,b)=>a+b,0)}}
function workWarn(p){

      :(t.tag==='esp'||t.tag==='mod')&&!t.past?`<button type="button" class="bd ${t.tag}" data-act="day-reset" data-c="${i}" data-tip="Restablecer a la semana tipo">${t.tag==='esp'?'Especial':'Modificado'} ↺</button>`:t.today?'<span class="bd today">Hoy</span>':t.past?'<span class="bd past">Pasado</span>':'';

  'svc-del'(el){const p=pk(S.svcP),i=p.services.findIndex(x=>x.id===el.dataset.id),s=p.services[i],c=cat(s.cat);
    p.services.splice(i,1);render();
    toast(`“${c.name}” quitado de ${p.name}.`,'info',()=>{p.services.splice(i,0,s);render()})},
  /* personal */
  'emp-new':()=>openEmpForm(null),'emp-edit':el=>openEmpForm(el.dataset.id),
  'menu-e'(el){const e=emp(el.dataset.id);showMenu(el,mi('me-edit',e.id,'edit','Editar empleado')+(e.pid?mi('me-un',e.id,'unlink','Quitar de sucursal y turno'):'')+`<hr>`+mi('me-del',e.id,'trash','Eliminar empleado','d'))},
  'me-edit':el=>openEmpForm(el.dataset.id),
  'me-un'(el){const e=emp(el.dataset.id);if(pendRes(e.id).length)return toast(`${e.name} tiene ${pendRes(e.id).length} reservas activas o pendientes. Reasignalas desde Reservas primero.`,'err');const old=e.pid,l=dropShifts(e.id);e.pid=null;render();toast(`${e.name} quedó sin sucursal ni turnos.`,'info',()=>{e.pid=old;restoreShifts(l);render()})},
  'me-del'(el){const e=emp(el.dataset.id);if(pendRes(e.id).length)return toast(`${e.name} tiene ${pendRes(e.id).length} reservas activas o pendientes. Reasignalas desde Reservas primero.`,'err');confirmDlg({title:`¿Eliminar a ${esc(e.name)} ${esc(e.last)}?`,body:'Perderá el acceso al sistema de inmediato. Esta acción no se puede deshacer.',ok:'Eliminar empleado',danger:true,run(){dropShifts(e.id);S.employees=S.employees.filter(x=>x.id!==e.id);toast('Empleado eliminado.');render()}})},
  pw(el){const i=el.previousElementSibling;i.type=i.type==='password'?'text':'password';el.setAttribute('aria-label',i.type==='password'?'Mostrar contraseña':'Ocultar contraseña')},
  close:()=>closeLayer($('#layer')),
  'close-modal':()=>closeLayer($('#modal')),
  confirm(){const r=confirmDlg.run;closeLayer($('#modal'));r&&r()},
};
document.addEventListener('click',e=>{
  const m=$('#menu'), el=e.target.closest('[data-act]');
  if(m.classList.contains('on')&&!m.contains(e.target)&&!(el&&el.dataset.act.startsWith('menu')))closeMenu();
  if(!el)return;
  if(m.contains(el)){fromMenu=m.__btn;m.classList.remove('on');m.__btn&&m.__btn.removeAttribute('aria-expanded')}
  A[el.dataset.act]&&A[el.dataset.act](el,e);
  if(fromMenu){const b=fromMenu,s=selOf(b);fromMenu=null;setTimeout(()=>{if(document.activeElement===document.body||m.contains(document.activeElement)){const n=document.contains(b)?b:(s&&$(s));n&&n.focus()}},0)}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='pform')saveParking(e.target);
  else if(e.target.id==='eform')saveEmp(e.target);
  else if(e.target.id==='meform')saveMe(e.target);
  else if(e.target.id==='svc-add'){
    const f=e.target,p=pk(S.svcP),price=+f.price.value.replace(/\D/g,''),er=$('#svc-err');
    if(!(price>0)){er.style.display='flex';er.textContent='Ingresá un precio mayor a 0.';f.price.setAttribute('aria-invalid','true');f.price.focus();return}
    p.services.push({id:nextId('s'),cat:f.cat.value,price});toast(`“${cat(f.cat.value).name}” asignado a ${p.name}.`);render();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;render();return}
  if(t.id==='eq'){S.empQ=t.value;render();return}
  if(t.id==='rq'){S.rq=t.value;render();return}
  if(t.id==='sp'||t.id==='ti'||t.id==='si')t.value=t.value.replace(/\D/g,'');
  const f=t.closest&&t.closest('#pform,#eform,#meform');
  if(f){if(t.name){clearErr(f,t.name);const pr={open:'close',close:'open',is24:'close',min:'max',max:'min',from:'to',to:'from',pid:'d0'}[t.name];pr&&clearErr(f,pr);if(/^d\d$/.test(t.name)){clearErr(f,'d0');clearErr(f,'from')}}if(f.id==='pform')syncPForm()}
});
document.addEventListener('change',e=>{if(e.target.classList.contains('hol-mode')){const p=pk(S.shP),h=hol().find(z=>z.id===e.target.dataset.id),v=e.target.value,r=setHolMode(p,h,v);if(r.err){render();return toast(r.err,'err')}
    S.refocus=`.hol-mode[data-id="${h.id}"]`;if(v==='s'){S.shMode='date';S.shWk=monday(h.date)}S.W=null;render();toast(v==='s'?'Armá el horario especial en el calendario de esa fecha.':'Listo, guardado.','ok',()=>{r.undo();S.W=null;render()});return}
  if(e.target.id==='sh-sel'){S.shP=e.target.value;render();return}if(e.target.id==='res-emp'){const x=S.reservas.find(q=>q.id===e.target.dataset.id),w=emp(e.target.value);x.eid=w.id;toast(`Reserva ${x.code} asignada a ${w.name} ${w.last}.`);render()}else if(e.target.id==='rd'){if(e.target.value&&e.target.value<=TODAY){S.rd=e.target.value;S.refocus='#rd';render()}}else if(e.target.id==='ep'){S.empP=e.target.value;render()}else if(e.target.id==='rp'){S.rp=e.target.value;render()}else if(e.target.closest&&e.target.closest('#pform'))syncPForm()});
const tip=document.createElement('div');tip.id='tip';tip.setAttribute('aria-hidden','true');document.body.append(tip);
function tipShow(el){tip.textContent=el.dataset.tip;tip.classList.add('on');const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=(r.top-h-8<8?r.bottom+8:r.top-h-8)+'px'}
const tipHide=()=>tip.classList.remove('on');
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');t?tipShow(t):tipHide()});
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');t?tipShow(t):tipHide()});
document.addEventListener('focusout',tipHide);document.addEventListener('click',tipHide,true);document.addEventListener('scroll',tipHide,true);
document.addEventListener('pointerdown',e=>{
  const i=$('#ti')||$('#si');if(!i||e.target.closest('.inl'))return;
  if($('#ti')){const [pid,tk]=i.dataset.key.split(':'),v=+i.value.replace(/\D/g,'');if(v>0&&v!==pk(pid).prices[tk])A['t-save']({dataset:{key:i.dataset.key}});else{S.edit=null;S.terr='';render()}}
  else{const s=pk(S.svcP).services.find(x=>x.id===i.dataset.id),v=+i.value.replace(/\D/g,'');if(v>0&&s&&v!==s.price)A['svc-save']({dataset:{id:i.dataset.id}});else{S.svcEdit=null;render()}}
},true);
document.addEventListener('keydown',e=>{
  const t=e.target;if(e.key==='Escape')tipHide();
  if(e.key==='Escape'){
    if($('#menu').classList.contains('on'))return closeMenu();
    if($('#modal').classList.contains('on'))return closeLayer($('#modal'));
    if($('#layer').classList.contains('on'))return closeLayer($('#layer'));
    if(S.edit||S.svcEdit){S.refocus=S.edit?`[data-act="t-edit"][data-key="${S.edit}"]`:`[data-act="svc-edit"][data-id="${S.svcEdit}"]`;S.edit=null;S.svcEdit=null;S.terr='';render()}
  }
  if(e.key==='Enter'&&t.id==='ti'){e.preventDefault();A['t-save']({dataset:{key:t.dataset.key}})}
  if(e.key==='Enter'&&t.id==='si'){e.preventDefault();A['svc-save']({dataset:{id:t.dataset.id}})}
  const m=$('#menu');
  if(m.classList.contains('on')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const b=[...m.querySelectorAll('button')],i=b.indexOf(document.activeElement);b[(i+(e.key==='ArrowDown'?1:-1)+b.length)%b.length].focus()}
  if(e.key==='Tab'){const box=$('#modal.on .modal')||$('#layer.on .drawer');if(box){const f=[...box.querySelectorAll('button:not(:disabled),input:not(:disabled),select,[href]')].filter(n=>n.offsetParent);if(f.length){const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}}}
});

(function(){
  const q=new URLSearchParams(location.search), st=q.get('state');
  try{const th=localStorage.getItem('sc-theme');if(th)document.documentElement.dataset.theme=th}catch{}
  if(q.get('theme'))document.documentElement.dataset.theme=q.get('theme');
  if(st==='empty'){S.parkings=[];S.employees=[];S.reservas=[]}
  if(st==='loading'||st==='error')S.data=st;
  const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))S.view=h;
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==S.view){S.view=h;render()}});
  S.reservas.forEach(r=>{const e=deriveEmp(r);r.eid=e?e.id:null});
  render();
})();
